name: flutter_application_1
description: "CrediSol: préstamos con simulador, solicitud en línea y pago de cuotas por Yape, Plin o transferencia."
publish_to: 'none'

# versión visible (1.0.0) + número de compilación (1). Súbelo en cada publicación en Play Store.
version: 1.0.0+1

environment:
  sdk: '>=3.2.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Paquetes de Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  # Ubicación y enlaces externos (mapas, Yape, WhatsApp)
  geolocator: ^14.1.1
  url_launcher: ^6.3.2
  android_intent_plus: ^6.1.0
  # Fotos de identidad (solo cámara)
  image_picker: ^1.2.4
  # Recordatorios locales de cuotas
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Generadores (no se incluyen en la app): dart run flutter_launcher_icons / flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Ícono de la app: los 3 círculos del logo sobre fondo blanco.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icono_foreground.png"
  min_sdk_android: 24

# Pantalla de carga nativa (antes de que arranque Flutter).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icono_foreground.png
  ios: false
  web: false